<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Coins - Official App</title>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: linear-gradient(135deg, #4361ee, #7209b7);
            --secondary: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            --accent: #f1c40f;
            --glass: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Pyidaungsu', sans-serif;
            background: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            color: #2d3436;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: white;
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Header UI */
        .header {
            background: var(--primary);
            padding: 40px 20px;
            border-radius: 0 0 30px 30px;
            color: white;
            text-align: center;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.3);
        }

        .balance-card {
            background: var(--glass);
            margin: -30px 20px 20px 20px;
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        .coin-val {
            font-size: 45px;
            font-weight: 900;
            color: #f39c12;
            text-shadow: 1px 1px 0px #fff;
        }

        /* Input & Button Styling */
        .content { padding: 20px; }
        
        .section-title {
            font-weight: bold;
            font-size: 16px;
            margin: 20px 0 10px 5px;
            display: flex;
            align-items: center;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 14px;
            box-sizing: border-box;
            background: #fafafa;
        }

        button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 15px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-ad {
            background: var(--secondary);
            color: #d63384;
            border: 2px solid #ff9a9e;
            margin-bottom: 25px;
        }

        .btn-withdraw {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(67, 97, 238, 0.2);
        }

        #timer-box {
            display: none;
            color: #e74c3c;
            font-weight: bold;
            background: #fff5f5;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .hidden { display: none; }
        
        .footer-text {
            font-size: 12px;
            color: #a0a0a0;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="auth-section" style="padding: 50px 30px;">
            <h2 style="text-align: center; color: #4361ee;">Welcome</h2>
            <p style="text-align: center; color: #636e72; font-size: 14px;">အကောင့်ဝင်ရန် Email နှင့် Password ရိုက်ထည့်ပါ</p>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password (Min 8 chars)">
            <button class="btn-withdraw" onclick="handleAuth()">Login / Register</button>
        </div>

        <div id="main-app" class="hidden">
            <div class="header">
                <h2 style="margin:0;">Earn Coins</h2>
                <small style="opacity:0.8;">Ads ကြည့်ပြီး ပိုက်ဆံရှာပါ</small>
            </div>

            <div class="balance-card">
                <small style="color:#636e72; font-weight: bold;">လက်ကျန် Coins</small>
                <div class="coin-val" id="coinDisplay">0</div>
                <div id="timer-box">⏳ Ads ကြည့်နေသည်... <span id="seconds">15</span>s</div>
                <button id="adBtn" class="btn-ad" onclick="watchAd()">📺 Ads ကြည့်ပြီး 5 Coins ယူမည်</button>
            </div>

            <div class="content">
                <div class="section-title">💸 ငွေထုတ်ယူရန်</div>
                <select id="operator">
                    <option value="KPay">KPay</option>
                    <option value="Wave Pay">Wave Pay</option>
                    <option value="MPT (Topup)">MPT (Topup)</option>
                    <option value="Ooredoo (Topup)">Ooredoo (Topup)</option>
                    <option value="ATOM (Topup)">ATOM (Topup)</option>
                </select>
                <input type="text" id="targetPhone" placeholder="ဖုန်းနံပါတ် သို့မဟုတ် Wallet နံပါတ်">
                <input type="number" id="withdrawAmount" placeholder="ထုတ်ယူမည့်ပမာဏ (Min 1000)">
                <button class="btn-withdraw" onclick="requestWithdraw()">ငွေထုတ်ယူမည်</button>
                
                <div class="footer-text">
                    အနည်းဆုံး ၁၀၀၀ Coins ပြည့်မှ ငွေထုတ်ယူနိုင်ပါသည်။<br>
                    ငွေထုတ်ရန် ၂၄ နာရီအတွင်း ဆောင်ရွက်ပေးပါမည်။
                </div>
                
                <button style="background:none; color:#ff7675; margin-top:20px; font-size: 13px;" onclick="logout()">Logout ထွက်မည်</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <script>
        const { Client, Account, Databases, ID, Query } = Appwrite;
        const client = new Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject('6990a457003d6b0bbf82');
        const account = new Account(client);
        const databases = new Databases(client);

        const DB_ID = '6990a481001f67225b44';
        const USERS_COL = 'ip_404';
        const NOTI_COL = 'admin_notifications';

        let currentDocId = "";
        let userEmail = "";

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if(!email || pass.length < 8) return alert("Email နှင့် Password (၈ လုံးအထက်) မှန်အောင်ဖြည့်ပါ။");
            try {
                try { await account.create(ID.unique(), email, pass); } catch(e){}
                await account.createEmailSession(email, pass);
                location.reload();
            } catch (e) { alert("Login Error: " + e.message); }
        }

        async function checkSession() {
            try {
                const user = await account.get();
                userEmail = user.email;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');

                const res = await databases.listDocuments(DB_ID, USERS_COL, [Query.equal("phone", userEmail)]);
                if (res.documents.length > 0) {
                    currentDocId = res.documents[0].$id;
                    document.getElementById('coinDisplay').innerText = res.documents[0].balance;
                } else {
                    const newDoc = await databases.createDocument(DB_ID, USERS_COL, ID.unique(), {
                        phone: userEmail, username: userEmail.split('@')[0], balance: 0
                    });
                    currentDocId = newDoc.$id;
                }
            } catch (e) {}
        }

        async function watchAd() {
            const adsLink = 'https://www.effectivegatecpm.com/cjs2qkq14?key=e00a213c35437a8d9347baef32b83bd8';
            window.open(adsLink, '_blank');

            const btn = document.getElementById('adBtn');
            const timerDiv = document.getElementById('timer-box');
            const secSpan = document.getElementById('seconds');
            
            btn.classList.add('hidden');
            timerDiv.style.display = 'block';
            let timeLeft = 15;

            const countdown = setInterval(async () => {
                timeLeft--;
                secSpan.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDiv.style.display = 'none';
                    btn.classList.remove('hidden');
                    try {
                        const res = await databases.getDocument(DB_ID, USERS_COL, currentDocId);
                        let newBal = (res.balance || 0) + 5;
                        await databases.updateDocument(DB_ID, USERS_COL, currentDocId, { balance: newBal });
                        document.getElementById('coinDisplay').innerText = newBal;
                        alert("ဂုဏ်ယူပါတယ်။ 5 Coins ရရှိပါပြီ။");
                    } catch (e) { alert("Error: Appwrite Platform Settings တွင် Hostname ထည့်ရန် လိုအပ်ပါသည်။"); }
                }
            }, 1000);
        }

        async function requestWithdraw() {
            const amt = parseInt(document.getElementById('withdrawAmount').value);
            const ph = document.getElementById('targetPhone').value;
            const op = document.getElementById('operator').value;
            const currentBal = parseInt(document.getElementById('coinDisplay').innerText);

            if (!ph || !amt || amt < 1000) return alert("အနည်းဆုံး ၁၀၀၀ Coins ထုတ်ယူပါ။");
            if (currentBal < amt) return alert("လက်ကျန် Coins မလုံလောက်ပါ။");

            try {
                await databases.createDocument(DB_ID, NOTI_COL, ID.unique(), {
                    message: `📩 ငွေထုတ်ရန်: ${userEmail} မှ ${amt} Coins ကို ${op} (${ph}) ဖြင့် ထုတ်ယူလိုပါသည်။`,
                    status: "unread",
                    createdAt: new Date().toISOString()
                });
                const newBal = currentBal - amt;
                await databases.updateDocument(DB_ID, USERS_COL, currentDocId, { balance: newBal });
                document.getElementById('coinDisplay').innerText = newBal;
                alert("ငွေထုတ်တောင်းဆိုမှု အောင်မြင်ပါသည်။");
            } catch (e) { alert("ငွေထုတ်ရန် အဆင်မပြေပါ။ Admin Notifications Collection ကို အရင်ဆောက်ပေးပါ။"); }
        }

        async function logout() { await account.deleteSession('current'); location.reload(); }
        checkSession();
    </script>
</body>
</html>
