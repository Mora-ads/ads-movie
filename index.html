<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earn Coins - Official App</title>
    <link href="https://fonts.googleapis.com/css2?family=Pyidaungsu:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: linear-gradient(135deg, #4834d4, #686de0);
            --secondary: #ff7979;
            --accent: #f9ca24;
            --white: #ffffff;
            --bg: #f0f2f5;
        }

        body {
            font-family: 'Pyidaungsu', sans-serif;
            background: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 414px;
            background: var(--white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
        }

        /* Header UI */
        .header {
            background: var(--primary);
            padding: 50px 20px;
            border-radius: 0 0 30px 30px;
            color: white;
            text-align: center;
        }

        .balance-card {
            background: white;
            margin: -40px 20px 20px 20px;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
        }

        .coin-label { font-size: 14px; color: #95afc0; font-weight: bold; }
        .coin-val { font-size: 55px; font-weight: 900; color: var(--accent); margin: 5px 0; }

        /* Ads Button UI */
        .btn-ad {
            background: #eb4d4b;
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-ad:active { transform: scale(0.98); }

        #timer-box {
            display: none;
            color: #eb4d4b;
            font-weight: bold;
            font-size: 16px;
            padding: 15px;
            border: 2px dashed #eb4d4b;
            border-radius: 15px;
            margin-top: 10px;
        }

        /* Withdrawal Section UI */
        .content { padding: 25px; flex-grow: 1; }
        .section-title { font-weight: bold; font-size: 18px; margin-bottom: 15px; color: #2f3542; }

        input, select {
            width: 100%;
            padding: 15px;
            margin-bottom: 12px;
            border: 1px solid #dcdde1;
            border-radius: 12px;
            font-size: 15px;
            box-sizing: border-box;
            background: #f9f9f9;
        }

        .btn-withdraw {
            background: var(--primary);
            color: white;
            border: none;
            padding: 18px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(72, 52, 212, 0.3);
        }

        .hidden { display: none; }
        .logout-btn { color: #ff7979; border: none; background: none; margin-top: 20px; font-size: 14px; cursor: pointer; width: 100%; }
    </style>
</head>
<body>

    <div class="app-container">
        <div id="auth-section" style="padding: 60px 30px; text-align: center;">
            <h1 style="color: #4834d4;">Join Us</h1>
            <p style="color: #95afc0;">Ads ကြည့်ပြီး Coin ရှာရန် အကောင့်ဝင်ပါ</p>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password (Min 8 chars)">
            <button class="btn-withdraw" onclick="handleAuth()">အကောင့်ဝင်မည် / ဖွင့်မည်</button>
        </div>

        <div id="main-app" class="hidden">
            <div class="header">
                <h2 style="margin:0;">Earn Coins Official</h2>
                <small style="opacity:0.8;">ယုံကြည်စိတ်ချစွာ အသုံးပြုနိုင်ပါသည်</small>
            </div>

            <div class="balance-card">
                <div class="coin-label">လက်ကျန် COINS</div>
                <div class="coin-val" id="coinDisplay">0</div>
                
                <div id="timer-box">⏳ Ads ကြည့်နေသည်... <span id="seconds">15</span>s</div>
                <button id="adBtn" class="btn-ad" onclick="watchAd()">📺 Ads ကြည့်ပြီး 5 Coins ယူမည်</button>
            </div>

            <div class="content">
                <div class="section-title">💸 ငွေထုတ်ယူရန်</div>
                <select id="operator">
                    <option value="KPay">KPay</option>
                    <option value="Wave Pay">Wave Pay</option>
                    <option value="MPT (Topup)">MPT (Topup)</option>
                    <option value="Ooredoo (Topup)">Ooredoo (Topup)</option>
                    <option value="ATOM (Topup)">ATOM (Topup)</option>
                </select>
                <input type="text" id="targetPhone" placeholder="ဖုန်းနံပါတ် သို့မဟုတ် Wallet နံပါတ်">
                <input type="number" id="withdrawAmount" placeholder="ထုတ်ယူမည့်ပမာဏ (Min 1000)">
                <button class="btn-withdraw" onclick="requestWithdraw()">ငွေထုတ်ယူမည်</button>
                
                <button class="logout-btn" onclick="logout()">Account မှ ထွက်မည် (Logout)</button>
                <p style="font-size: 11px; color: #95afc0; text-align: center; margin-top: 20px;">
                    * အနည်းဆုံး ၁၀၀၀ Coins ပြည့်လျှင် ငွေထုတ်နိုင်ပါသည်။
                </p>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <script>
        const { Client, Account, Databases, ID, Query } = Appwrite;
        const client = new Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject('6990a457003d6b0bbf82');
        const account = new Account(client);
        const databases = new Databases(client);

        const DB_ID = '6990a481001f67225b44';
        const USERS_COL = 'ip_404'; // Screenshot [11] အရ
        const NOTI_COL = 'admin_notifications'; // Screenshot [11] အရ

        let currentDocId = "";
        let userEmail = "";

        async function handleAuth() {
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            if(!email || pass.length < 8) return alert("Email နှင့် Password (၈ လုံးအထက်) မှန်အောင်ဖြည့်ပါ။");
            try {
                try { await account.create(ID.unique(), email, pass); } catch(e){}
                await account.createEmailSession(email, pass);
                location.reload();
            } catch (e) { alert("Login Error: " + e.message); }
        }

        async function checkSession() {
            try {
                const user = await account.get();
                userEmail = user.email;
                document.getElementById('auth-section').classList.add('hidden');
                document.getElementById('main-app').classList.remove('hidden');

                const res = await databases.listDocuments(DB_ID, USERS_COL, [Query.equal("phone", userEmail)]);
                if (res.documents.length > 0) {
                    currentDocId = res.documents[0].$id;
                    document.getElementById('coinDisplay').innerText = res.documents[0].balance;
                } else {
                    const newDoc = await databases.createDocument(DB_ID, USERS_COL, ID.unique(), {
                        phone: userEmail, username: userEmail.split('@')[0], balance: 0
                    });
                    currentDocId = newDoc.$id;
                }
            } catch (e) {}
        }

        async function watchAd() {
            const adsLink = 'https://www.effectivegatecpm.com/cjs2qkq14?key=e00a213c35437a8d9347baef32b83bd8';
            window.open(adsLink, '_blank');

            const btn = document.getElementById('adBtn');
            const timerDiv = document.getElementById('timer-box');
            const secSpan = document.getElementById('seconds');
            
            btn.style.display = 'none';
            timerDiv.style.display = 'block';
            let timeLeft = 15;

            const countdown = setInterval(async () => {
                timeLeft--;
                secSpan.innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(countdown);
                    timerDiv.style.display = 'none';
                    btn.style.display = 'block';
                    try {
                        const res = await databases.getDocument(DB_ID, USERS_COL, currentDocId);
                        let newBal = (res.balance || 0) + 5;
                        await databases.updateDocument(DB_ID, USERS_COL, currentDocId, { balance: newBal });
                        document.getElementById('coinDisplay').innerText = newBal;
                        alert("ဂုဏ်ယူပါတယ်။ 5 Coins ရရှိပါပြီ။");
                    } catch (e) { alert("Error: Appwrite Platform Settings ပြန်စစ်ပါ။"); }
                }
            }, 1000);
        }

        async function requestWithdraw() {
            const amt = parseInt(document.getElementById('withdrawAmount').value);
            const ph = document.getElementById('targetPhone').value;
            const op = document.getElementById('operator').value;
            const currentBal = parseInt(document.getElementById('coinDisplay').innerText);

            if (!ph || !amt || amt < 1000) return alert("အနည်းဆုံး ၁၀၀၀ Coins ထုတ်ယူပါ။");
            if (currentBal < amt) return alert("လက်ကျန် Coins မလုံလောက်ပါ။");

            try {
                await databases.createDocument(DB_ID, NOTI_COL, ID.unique(), {
                    message: `💰 ငွေထုတ်ရန်: ${userEmail} မှ ${amt} Coins ကို ${op} (${ph}) ဖြင့် တောင်းဆိုထားပါသည်။`,
                    status: "unread",
                    createdAt: new Date().toISOString()
                });
                const newBal = currentBal - amt;
                await databases.updateDocument(DB_ID, USERS_COL, currentDocId, { balance: newBal });
                document.getElementById('coinDisplay').innerText = newBal;
                alert("ငွေထုတ်တောင်းဆိုမှု အောင်မြင်ပါသည်။ Admin မှ စစ်ဆေးပြီး ပို့ပေးပါမည်။");
            } catch (e) { alert("Error: admin_notifications collection အား Appwrite တွင် အရင်ဆောက်ပေးပါ။"); }
        }

        async function logout() { await account.deleteSession('current'); location.reload(); }
        checkSession();
    </script>
</body>
</html>
