<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mora Admin Premium v3</title>
    <style>
        /* 3D Moving Gradient Background */
        body {
            margin: 0; padding: 20px; font-family: sans-serif;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh; display: flex; justify-content: center;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%; max-width: 800px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px; padding: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
        }

        /* RGB Text Animation */
        .rgb-title {
            font-size: 35px; font-weight: 900; text-align: center;
            background: linear-gradient(to right, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: rgbShift 3s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes rgbShift { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }

        /* 3D Stats */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px; }
        .stat-card {
            background: white; padding: 20px; border-radius: 20px; text-align: center;
            transform: perspective(1000px) rotateX(5deg);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .stat-card h3 { font-size: 30px; margin: 0; color: #2d3436; }

        /* List Items */
        .list-box { background: rgba(255, 255, 255, 0.9); border-radius: 20px; padding: 20px; }
        .noti-item {
            background: #fff; margin-bottom: 15px; padding: 20px;
            border-radius: 15px; border-left: 8px solid #6c5ce7;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .msg-info { flex: 1; }
        .btn-group { display: flex; flex-direction: column; gap: 8px; margin-left: 15px; }

        button { border: none; border-radius: 10px; padding: 10px 15px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-pay { background: #00b894; color: white; } /* ငွေလွှဲပြီးစာပို့ခလုတ် */
        .btn-del { background: #d63031; color: white; } /* ဖျက်သည့်ခလုတ် */
        .refresh-btn { width: 100%; padding: 15px; background: #2d3436; color: white; margin-bottom: 20px; font-size: 16px; border-radius: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="rgb-title">Mora Ads Admin v3</div>
    
    <button class="refresh-btn" onclick="initAdmin()">REFRESH (စာရင်းအသစ်ဖတ်မည်)</button>

    <div class="stats-grid">
        <div class="stat-card">
            <h3 id="userCount">0</h3>
            <p style="font-weight:bold; color:#636e72;">USERS အယောက်ရေ</p>
        </div>
        <div class="stat-card">
            <h3 id="pendingCount">0</h3>
            <p style="font-weight:bold; color:#636e72;">PENDING PAYOUTS</p>
        </div>
    </div>

    <div class="list-box">
        <h2 style="color: #2d3436; margin-top: 0;">📩 ငွေတောင်းခံလွှာများနှင့် အကြောင်းပြန်ရန်</h2>
        <div id="notiList">Loading requests...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
<script>
    const { Client, Databases, Query, ID } = Appwrite;
    const client = new Client().setEndpoint('https://sgp.cloud.appwrite.io/v1').setProject('6990a457003d6b0bbf82');
    const databases = new Databases(client);

    const DB_ID = '6990a481001f67225b44';
    const USERS_COL = 'ip_404';
    const NOTI_COL = 'admin_notifications';
    const MSG_COL = 'user_messages'; // User ဆီ စာပြန်ပို့မည့် Table

    async function initAdmin() {
        fetchUserCount();
        fetchNotifications();
    }

    async function fetchUserCount() {
        try {
            const res = await databases.listDocuments(DB_ID, USERS_COL);
            document.getElementById('userCount').innerText = res.total;
        } catch (e) { console.log(e); }
    }

    async function fetchNotifications() {
        const listDiv = document.getElementById('notiList');
        try {
            const res = await databases.listDocuments(DB_ID, NOTI_COL, [Query.orderDesc("$createdAt")]);
            document.getElementById('pendingCount').innerText = res.total;
            listDiv.innerHTML = "";

            if (res.documents.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center;'>တောင်းဆိုမှု မရှိသေးပါ။</p>";
                return;
            }

            res.documents.forEach(doc => {
                const item = document.createElement('div');
                item.className = 'noti-item';
                item.innerHTML = `
                    <div class="msg-info">
                        <small style="color:#b2bec3;">${new Date(doc.$createdAt).toLocaleString()}</small>
                        <div style="font-size:15px; font-weight:bold; margin-top:5px;">${doc.message}</div>
                    </div>
                    <div class="btn-group">
                        <button class="btn-pay" onclick="payAndReply('${doc.$id}')">ငွေလွှဲပြီး (စာပို့)</button>
                        <button class="btn-del" onclick="deleteItem('${doc.$id}')">ဖျက်မည်</button>
                    </div>
                `;
                listDiv.appendChild(item);
            });
        } catch (e) {
            listDiv.innerHTML = "<p>Error: admin_notifications table ကို စစ်ဆေးပါ။</p>";
        }
    }

    // ငွေလွှဲပြီးကြောင်း User ဆီ စာပို့မည့် Function
    async function payAndReply(docId) {
        const reply = prompt("User ဆီသို့ ပို့မည့် အကြောင်းပြန်စာကို ရေးပါ-", "သင့်ငွေထုတ်ယူမှု အောင်မြင်ပါသည်။ ကျေးဇူးတင်ပါသည်။");
        
        if (reply) {
            try {
                // ၁။ စာရင်းဟောင်းကို အရင်ဖတ်ပြီး User ဖုန်း/Email ယူရန် (ရိုးရှင်းအောင် userId အစား message ကိုပဲ ပြန်သုံးမည်)
                await databases.createDocument(DB_ID, MSG_COL, ID.unique(), {
                    message: reply,
                    date: new Date().toISOString()
                });

                // ၂။ တောင်းဆိုမှုကို ဖျက်မည်
                await databases.deleteDocument(DB_ID, NOTI_COL, docId);
                
                alert("စာပို့ပြီးပါပြီ။ စာရင်းကို ဖျက်လိုက်ပါပြီ။");
                initAdmin();
            } catch (e) {
                alert("Error: user_messages table ကို Appwrite မှာ အရင်ဆောက်ပေးပါ။");
            }
        }
    }

    async function deleteItem(id) {
        if (confirm("ဤစာရင်းကို ဖျက်မှာ သေချာပါသလား?")) {
            await databases.deleteDocument(DB_ID, NOTI_COL, id);
            initAdmin();
        }
    }

    initAdmin();
</script>
</body>
</html>
